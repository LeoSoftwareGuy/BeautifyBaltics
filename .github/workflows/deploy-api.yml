name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'src/BeautifyBaltics.Core.API/**'
      - 'src/BeautifyBaltics.Domain/**'
      - 'src/BeautifyBaltics.Infrastructure/**'
      - 'src/BeautifyBaltics.Persistence/**'
      - 'src/BeautifyBaltics.ServiceDefaults/**'
      - 'src/Integrations/**'
      - 'Directory.Build.props'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BeautifyBaltics.Core.API/Dockerfile
          push: true
          tags: ghcr.io/leosoftwareguy/beautifybaltics-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u leosoftwareguy --password-stdin
            docker pull ghcr.io/leosoftwareguy/beautifybaltics-api:latest
            cd /opt/beautifybaltics
            docker compose up -d --no-deps api
            docker image prune -f
