name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'src/BeautifyBaltics.Core.API/**'
      - 'src/BeautifyBaltics.Domain/**'
      - 'src/BeautifyBaltics.Infrastructure/**'
      - 'src/BeautifyBaltics.Persistence/**'
      - 'src/BeautifyBaltics.ServiceDefaults/**'
      - 'src/Integrations/**'
      - 'Directory.Build.props'
      - 'fly.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
